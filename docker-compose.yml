services:
  api:
    build:
      context: .
    container_name: pdf-to-markdown
    environment:
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-10485760}
      MAX_PAGES: ${MAX_PAGES:-200}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped
